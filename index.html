<style>
:root{
  /* ── tokens GoodApps Academy ── */
  --ink-50:#F3F5F7;--ink-100:#E2E8EB;--ink-200:#CAD5DA;--ink-300:#ADBDC6;--ink-400:#8CA2AE;--ink-500:#6A8797;--ink-600:#496C7F;--ink-700:#2C556B;--ink-800:#0F3E57;--ink-900:#0A2A3B;
  --green-100:#E9FCF2;--green-200:#D1F9E4;--green-300:#A3F2C8;--green-400:#65EAA4;--green-700:#2E7754;--green-800:#1F573E;--green-900:#123D2C;
  --amber-100:#FEF1E2;--amber-200:#FDDEBC;--amber-300:#FBC68A;--amber-500:#F7911E;--amber-600:#CE7818;--amber-700:#A15C12;
  --slate-50:#FAFAFB;--slate-100:#F0F1F1;--slate-200:#DDE1E4;--slate-300:#C0C7CD;--slate-400:#A1ABB3;--slate-500:#7C8B96;
  --brand-gradient:linear-gradient(90deg,#F7911E 0%,#65EAA4 100%);
  --shadow:0 8px 32px rgba(15,62,87,.12);
  --font:"DM Sans","Inter","Helvetica Neue",Arial,sans-serif;
  --font-num:"Rokkitt","Roboto Slab",Georgia,serif;
  /* ── semántica modo claro (default) ── */
  --canvas:var(--slate-100);--grid:var(--slate-300);
  --card:#FFFFFF;--card-border:var(--ink-800);
  --t1:var(--ink-800);--t2:var(--ink-700);--t3:var(--ink-600);
  --concept:var(--green-700);--action:var(--amber-700);
  --marker:var(--green-200);--marker-ink:var(--ink-800);
  --link:var(--ink-200);--link-on:var(--green-700);
  --bubble:var(--amber-100);--bubble-ink:var(--ink-800);--bubble-border:transparent;
  --pill-ink:var(--ink-800);--pill-green:var(--green-700);--pill-amber:var(--amber-700);--pill-halo:none;
  --badge:var(--ink-800);--badge-ink:#FFFFFF;
  --bar:#FFFFFF;--bar-border:var(--slate-200);--bar-hover:var(--slate-100);
  --field:var(--slate-50);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --canvas:var(--ink-800);--grid:var(--ink-700);
  --card:var(--ink-700);--card-border:var(--ink-600);
  --t1:#FFFFFF;--t2:var(--ink-200);--t3:var(--ink-300);
  --concept:var(--green-400);--action:var(--amber-500);
  --marker:var(--green-200);--marker-ink:var(--ink-800);
  --link:var(--ink-600);--link-on:var(--green-400);
  --bubble:var(--ink-700);--bubble-ink:var(--green-400);--bubble-border:var(--ink-600);
  --pill-ink:#FFFFFF;--pill-green:var(--green-400);--pill-amber:var(--amber-500);--pill-halo:0 0 16px rgba(101,234,164,.35);
  --badge:var(--green-400);--badge-ink:var(--ink-800);
  --bar:var(--ink-700);--bar-border:var(--ink-600);--bar-hover:var(--ink-600);
  --field:var(--ink-800);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;font-weight:400;line-height:1.45;color:var(--t1);background:var(--canvas);overflow:hidden;text-align:left;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--concept);outline-offset:2px}
#root{height:100%}
[hidden]{display:none!important}

/* ── canvas ── */
.canvas{position:absolute;inset:0;background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);touch-action:none;cursor:grab;overflow:hidden}
.canvas:active{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.links{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
.links path{fill:none;stroke:var(--link);stroke-width:2;transform:translate(20000px,20000px)}
.links path.on{stroke:var(--link-on);stroke-width:3}

/* ── tarjeta ── */
.card{position:absolute;background:var(--abg,var(--card));border:2px solid var(--card-border);border-radius:24px;padding:26px 24px 26px;cursor:pointer;user-select:none;transition:border-color .12s}
.card.selected{border-color:var(--concept);border-width:3px;padding:25px 23px 25px}
.card .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.card .rule{width:48px;height:4px;background:var(--amber-500);margin:8px 0 14px}
.card .title{font-size:16px;font-weight:700;line-height:1.3;color:var(--t1);text-wrap:balance}
.card .subtitle{font-size:13px;font-weight:500;color:var(--t2);margin-top:3px}
.card.root .title{font-size:20px}
.card .title.mark,.d-head h2.mark{background:var(--marker);color:var(--marker-ink);padding:0 8px;border-radius:2px;display:inline-block;box-decoration-break:clone}
.card .editing,.drawer .editing{outline:2px solid var(--concept);outline-offset:2px;border-radius:2px;cursor:text;user-select:text}
.bubble{position:absolute;left:-16px;top:-16px;width:48px;height:48px;border-radius:50%;background:var(--bubble);color:var(--bubble-ink);display:grid;place-items:center;border:2px solid var(--bubble-border)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:2px solid var(--pill-green);color:var(--pill-ink);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:transparent;box-shadow:var(--pill-halo);white-space:nowrap}
.pill.amber{border-color:var(--pill-amber)}
.pill.small{height:22px;padding:0 8px;font-size:12px;margin-left:6px}
.people{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:2px solid var(--link);display:flex;flex-direction:column;gap:6px}
.people li{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;font-size:13px}
.pname{font-weight:700;color:var(--t2)}
.nivel{font-size:12px;font-weight:500;color:var(--t3);margin-left:8px;letter-spacing:.02em}
.drawer.info{width:min(400px,calc(100% - 40px))}

        h("div", { className: "chatlog", role: "log", "aria-live": "polite" },
          msgs.length === 0 && h("div", { className: "chatvacio" }, h("p", null, "Ejemplos:"), h("ul", null,
            h("li", null, "¿Quién reporta a la COO?"),
            h("li", null, MODE === "nominal" ? "¿Cuántos seniors hay en Desarrollo y quiénes son?" : "¿Qué puestos están vacantes?"),
            h("li", null, "¿Qué puestos supervisa la Gerencia Comercial?"))),
          msgs.map((m, i) => h("div", { key: i, className: "burbuja " + m.role }, m.content)),
          busy && msgs[msgs.length - 1] && msgs[msgs.length - 1].role === "user" && h("div", { className: "burbuja assistant" }, "Pensando…"),
          h("div", { ref: chatEndRef })),
        h("form", { className: "chatinput", onSubmit: e => { e.preventDefault(); preguntar(); } },
          h("input", { type: "text", placeholder: "Escribí tu consulta…", value: pregunta, onChange: e => setPregunta(e.target.value), "aria-label": "Consulta al mapa", disabled: busy }),
          h("button", { className: "askbtn", type: "submit", disabled: busy || !pregunta.trim(), "aria-label": "Enviar" }, h(Icon, { name: "Send", size: 18 })))),
      h("input", { ref: fileRef, type: "file", accept: "application/json,.json", hidden: true, onChange: importJson, "aria-hidden": true }),
      toast && h("div", { className: "toast", role: "status" }, toast));
  }

  // ── auto-publicación: reconstruye el documento completo con el estado actual ──
  function buildHtml(state) {
    const shellEl = document.getElementById("shell"); if (!shellEl) throw { code: "capability_disabled" };
    const shell = shellEl.textContent.replace(/<\\\//g, "</");
    const stateTag = '<script id="state" type="application/json">' + JSON.stringify(state).replace(/<\//g, "<\\/") + "</" + "script>";
    const shellTag = '<script id="shell" type="text/plain">' + shell.replace(/<\//g, "<\\/") + "</" + "script>";
    return shell.replace("<!--STATE-->", stateTag).replace("<!--SHELL-->", shellTag);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();

</script>
</body>
</html>
