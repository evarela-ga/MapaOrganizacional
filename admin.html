<style>
:root{
  --ink-50:#F3F5F7;--ink-100:#E2E8EB;--ink-200:#CAD5DA;--ink-300:#ADBDC6;--ink-400:#8CA2AE;--ink-500:#6A8797;--ink-600:#496C7F;--ink-700:#2C556B;--ink-800:#0F3E57;--ink-900:#0A2A3B;
  --green-100:#E9FCF2;--green-200:#D1F9E4;--green-400:#65EAA4;--green-700:#2E7754;
  --amber-100:#FEF1E2;--amber-500:#F7911E;--amber-600:#CE7818;--amber-700:#A15C12;
  --slate-50:#FAFAFB;--slate-100:#F0F1F1;--slate-200:#DDE1E4;--slate-300:#C0C7CD;--slate-500:#7C8B96;
  --brand-gradient:linear-gradient(90deg,#F7911E 0%,#65EAA4 100%);
  --shadow:0 8px 32px rgba(15,62,87,.12);
  --font:"DM Sans","Inter","Helvetica Neue",Arial,sans-serif;
  --font-num:"Rokkitt","Roboto Slab",Georgia,serif;
  --bg:var(--slate-100);--bar:#FFFFFF;--bar-border:var(--slate-200);--bar-hover:var(--slate-100);
  --t1:var(--ink-800);--t2:var(--ink-700);--t3:var(--ink-600);
  --concept:var(--green-700);--action:var(--amber-700);
  --pill-green:var(--green-700);--pill-amber:var(--amber-700);--pill-ink:var(--ink-800);--pill-halo:none;
  --field:var(--slate-50);--marker:var(--green-200);--marker-ink:var(--ink-800);
  --danger:#C23B3B;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:var(--ink-800);--bar:var(--ink-700);--bar-border:var(--ink-600);--bar-hover:var(--ink-600);
  --t1:#FFFFFF;--t2:var(--ink-200);--t3:var(--ink-300);
  --concept:var(--green-400);--action:var(--amber-500);
  --pill-green:var(--green-400);--pill-amber:var(--amber-500);--pill-ink:#FFFFFF;--pill-halo:0 0 16px rgba(101,234,164,.35);
  --field:var(--ink-800);--marker:var(--green-200);--marker-ink:var(--ink-800);
  --danger:#E06666;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;color:var(--t1);background:var(--bg);text-align:left;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--concept);outline-offset:2px}
#root{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}

.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px 16px;background:var(--bar);border-bottom:1px solid var(--bar-border);position:relative;flex-wrap:wrap}
.topbar::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:6px;background:var(--brand-gradient);border-radius:3px 3px 0 0}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-right:14px;border-right:1px solid var(--bar-border)}
.brand-logo{height:44px;width:auto;max-width:none;object-fit:contain;align-self:flex-start;display:none}
.brand-link{display:block;line-height:0}.brand-link:hover .brand-logo{filter:brightness(1.08)}
.brand-logo.light{display:block}
:root[data-theme="dark"] .brand-logo.light{display:none}
:root[data-theme="dark"] .brand-logo.dark{display:block}
.brand-sub{font-size:12px;font-weight:500;color:var(--t3)}
.viewsel{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--bar-border);background:var(--field);color:var(--t1);font-weight:500;font-size:13px;max-width:230px}
.counter{display:flex;align-items:baseline;gap:4px 6px;white-space:nowrap}
.counter .num{font-family:var(--font-num);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.counter .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-right:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:2px solid var(--pill-amber);color:var(--pill-ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;box-shadow:var(--pill-halo);white-space:nowrap}
.group{display:flex;align-items:center;gap:4px;margin-left:auto}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t1)}
.iconbtn:hover{background:var(--bar-hover)}
.savebtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:transparent;color:var(--t3);border:1px solid var(--bar-border);font-weight:700;white-space:nowrap}
.savebtn.dirty{background:var(--amber-500);color:var(--ink-800);border-color:var(--amber-500)}
.savebtn.dirty:hover{background:var(--amber-600)}

.tabs{display:flex;align-items:center;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;font-weight:700;font-size:13px;color:var(--t2);border:1px solid var(--bar-border);background:var(--bar)}
.tab.on{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.tab .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--t3)}
.tab.on .n{color:var(--ink-700)}
.search{display:flex;align-items:center;gap:8px;background:var(--bar);border:1px solid var(--bar-border);border-radius:999px;padding:0 12px;height:38px;min-width:200px;color:var(--t3);flex:1;max-width:320px;margin-left:auto}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--t1);font-weight:500}
.search input::placeholder{color:var(--t3)}

.layout{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0;gap:0;padding:14px 20px 62px}
.list{overflow:auto;background:var(--bar);border:1px solid var(--bar-border);border-radius:20px 0 0 20px;display:flex;flex-direction:column}
.addbtn{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--amber-500);color:var(--ink-800);font-weight:700;border-radius:20px 0 0 0}
.addbtn:hover{background:var(--amber-600)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
/* GoodApps — control de acceso con Google (solo sitio estático; los artefactos de claude.ai
   ya están protegidos por el compartir de claude.ai). Se activa únicamente cuando
   goodapps-access.json tiene clientId y al menos un usuario autorizado. */
(function () {
  const isStatic = !window.claude || !window.claude.use;
  const VIEW = (function () { const p = (location.pathname.split("/").pop() || "index.html").replace(".html", ""); return p || "index"; })();
  const VIEW_NAMES = { index: "Organigrama (anónimo)", nominal: "Organigrama nominal", legajo: "Legajo", dashboard: "Dashboard", admin: "Administración" };

  function match(cfg, email) {
    email = (email || "").toLowerCase().trim();
    if (!email) return null;
    if (cfg.domain && !email.endsWith("@" + String(cfg.domain).toLowerCase())) return { deny: "dominio", email };
    const u = (cfg.users || []).find(x => (x.email || "").toLowerCase().trim() === email);
    if (!u) return { deny: "lista", email };
    if (u.vistas && u.vistas.length && !u.vistas.includes(VIEW)) return { deny: "vista", email, vistas: u.vistas };
    return { email, ia: u.ia !== false, sueldo: u.sueldo === true, descargas: u.descargas === true, vistas: u.vistas || [] };
  }

  function gateRun() {
    return new Promise(function (resolve) {
      if (!isStatic) { resolve(null); return; }
      (async function () {
        let cfg = null;
        try { const r = await fetch("goodapps-access.json", { cache: "no-store" }); if (r.ok) cfg = await r.json(); } catch (e) {}
        if (!cfg || !(cfg.users || []).length) { resolve(null); return; }
        try {
          const s = JSON.parse(localStorage.getItem("ga-user") || "null");
          if (s && s.exp > Date.now()) { const u = match(cfg, s.email); if (u && !u.deny) { u.name = s.name || ""; u.pic = s.pic || ""; listo(u, resolve); return; } }
        } catch (e) {}
        overlay(cfg, resolve);
      })();
    });
  }
  function esc(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  window.gaLogout = function () {
    try { localStorage.removeItem("ga-user"); } catch (e) {}
    try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
    location.reload();
  };

  function listo(u, resolve) { window.GA_USER = u; montarChip(u); resolve(u); }

  function montarChip(u) {
    if (!isStatic) return;
    const poner = function () {
      if (document.getElementById("ga-chip")) return true;
      const bar = document.querySelector("header.topbar, .toolbar");
      if (!bar) return false;
      const d = document.createElement("div");
      d.id = "ga-chip";
      d.setAttribute("style", "display:flex;align-items:center;gap:7px;margin-left:6px;padding:3px 5px 3px 4px;border:1px solid rgba(125,145,155,.45);border-radius:999px;font-family:inherit;flex:0 0 auto");
      d.title = u.email;
      const nom = u.name || u.email.split("@")[0];
      const av = u.pic
        ? '<img src="' + esc(u.pic) + '" alt="" referrerpolicy="no-referrer" style="width:26px;height:26px;border-radius:50%;display:block">'
        : '<span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#F7911E,#65EAA4);color:#0F3E57;font-weight:700;font-size:13px">' + esc(nom.charAt(0).toUpperCase()) + "</span>";
      d.innerHTML = av +
        '<span style="font-size:12.5px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit">' + esc(nom) + "</span>" +
        '<button id="ga-out" type="button" aria-label="Cerrar sesión" title="Cerrar sesión (' + esc(u.email) + ')" style="display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;padding:0;opacity:.85">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>';
      bar.appendChild(d);
      d.querySelector("#ga-out").addEventListener("click", window.gaLogout);
      return true;
    };
    if (!poner()) { const t = setInterval(function () { if (poner()) clearInterval(t); }, 300); setTimeout(function () { clearInterval(t); }, 20000); }
    setInterval(function () { const c = document.getElementById("ga-chip"); if (!c || !c.isConnected) poner(); }, 3000);
  }

  const arranque = function () { window.__gateP = gateRun(); };
  if (document.body) arranque(); else document.addEventListener("DOMContentLoaded", arranque);
  window.__gate = function () { return window.__gateP || gateRun(); };

  function overlay(cfg, resolve) {
    const conGoogle = cfg.clientId && /[.]apps[.]googleusercontent[.]com$/.test(String(cfg.clientId).trim());
    const ov = document.createElement("div");
    ov.id = "ga-gate";
    ov.setAttribute("style", "position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0A2A3B;font-family:'DM Sans','Inter',Arial,sans-serif;color:#fff;text-align:center;padding:24px;");
    const logo = document.getElementById("logo-dark");
    ov.innerHTML = '<div style="max-width:420px;width:100%">' +
      (logo ? '<img src="' + logo.textContent.trim() + '" alt="GoodApps" style="height:36px;margin-bottom:18px">' : "") +
      '<div style="height:5px;width:120px;margin:0 auto 22px;border-radius:3px;background:linear-gradient(90deg,#F7911E,#65EAA4)"></div>' +
      '<h1 style="margin:0 0 6px;font-size:22px;font-weight:700">Mapa Organizacional GoodApps</h1>' +
      '<p style="margin:0 0 22px;color:#ADBDC6;font-size:14px;line-height:1.5">' + (VIEW_NAMES[VIEW] || VIEW) + " · solo cuentas corporativas @" + (cfg.domain || "goodapps.com.ar") + "</p>" +
      '<div id="ga-btn" style="display:flex;justify-content:center"></div>' +
      '<p id="ga-msg" style="margin:18px 0 0;color:#F7911E;font-weight:600;font-size:13.5px;min-height:20px"></p></div>';
    document.body.appendChild(ov);
    const msg = t => { const el = document.getElementById("ga-msg"); if (el) el.textContent = t; };
    const entrar = u => { try { localStorage.setItem("ga-user", JSON.stringify({ email: u.email, name: u.name || "", pic: u.pic || "", exp: Date.now() + 8 * 3600 * 1000 })); } catch (e) {} ov.remove(); listo(u, resolve); };
    const validar = email => {
      const u = match(cfg, email);
      if (!u || u.deny === "dominio") { msg("Solo se permiten cuentas @" + cfg.domain + "."); return; }
      if (u.deny === "lista") { msg("La cuenta " + email + " no está autorizada. Pedile acceso a Dirección o Gestión del Talento."); return; }
      if (u.deny === "vista") { msg("Tu cuenta no tiene acceso a esta vista. Tenés acceso a: " + (u.vistas || []).map(v => VIEW_NAMES[v] || v).join(", ") + "."); return; }
      entrar(u);
    };
    if (!conGoogle) {
      const box = document.getElementById("ga-btn");
      box.innerHTML = '<form id="ga-form" style="display:flex;gap:8px;width:100%;max-width:360px;margin:0 auto">' +
        '<input id="ga-mail" type="email" required placeholder="nombre@' + (cfg.domain || "goodapps.com.ar") + '" style="flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid #496C7F;background:#0F3E57;color:#fff;font:inherit;font-size:14px">' +
        '<button type="submit" style="padding:0 18px;border:0;border-radius:999px;background:#F7911E;color:#0F3E57;font:inherit;font-weight:700;cursor:pointer">Ingresar</button></form>';
      document.getElementById("ga-form").addEventListener("submit", function (e) { e.preventDefault(); validar(document.getElementById("ga-mail").value); });
      setTimeout(function () { const i = document.getElementById("ga-mail"); if (i) i.focus(); }, 50);
      return;
    }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onerror = function () { msg("No se pudo cargar Google Sign-In. Revisá la conexión y recargá."); };
    s.onload = function () {
      try {
        google.accounts.id.initialize({
          client_id: cfg.clientId,
          callback: function (resp) {
            try {
              const payload = JSON.parse(decodeURIComponent(escape(atob(resp.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
              if (!payload.email || payload.email_verified === false) { msg("No se pudo verificar la cuenta."); return; }
              const u = match(cfg, payload.email);
              if (!u || u.deny === "dominio") { msg("Solo se permiten cuentas @" + cfg.domain + ". Ingresaste con " + payload.email + "."); return; }
              if (u.deny === "lista") { msg("La cuenta " + payload.email + " no está autorizada. Pedile acceso a Dirección o Gestión del Talento."); return; }
              if (u.deny === "vista") { msg("Tu cuenta no tiene acceso a esta vista. Tenés acceso a: " + (u.vistas || []).map(v => VIEW_NAMES[v] || v).join(", ") + "."); return; }
              u.name = payload.name || ""; u.pic = payload.picture || "";
              try { localStorage.setItem("ga-user", JSON.stringify({ email: u.email, name: u.name, pic: u.pic, exp: Date.now() + 8 * 3600 * 1000 })); } catch (e) {}
              ov.remove();
              listo(u, resolve);
            } catch (e) { msg("Error procesando la respuesta de Google."); }
          }
        });
        google.accounts.id.renderButton(document.getElementById("ga-btn"), { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill", width: 280 });
      } catch (e) { msg("No se pudo iniciar Google Sign-In. Verificá el Client ID en Administración."); }
    };
    document.head.appendChild(s);
  }
})();

</script>

<script>

      case "toggleRol": {
        return { ...D, people: s.people.map(p => { if (p.id !== a.id) return p; const tiene = p.roles.includes(a.rol); return { ...p, roles: tiene ? p.roles.filter(r => r !== a.rol) : [...p.roles, a.rol] }; }) };

    const shell = shellEl.textContent.replace(/<\\\//g, "</");
    const stateTag = '<script id="state" type="application/json">' + JSON.stringify(state).replace(/<\//g, "<\\/") + "</" + "script>";
    const shellTag = '<script id="shell" type="text/plain">' + shell.replace(/<\//g, "<\\/") + "</" + "script>";
    return shell.replace("<!--STATE-->", stateTag).replace("<!--SHELL-->", shellTag);
  }
  const __mount = () => ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  if (window.__gate) window.__gate().then(__mount); else __mount();
})();

</script>
